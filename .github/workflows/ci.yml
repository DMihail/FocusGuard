name: CI

on:
  # Feature branches: one run via pull_request (avoids push+PR double fire).
  pull_request:
  push:
    branches: [main, dev, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_OPTIONS: --max-old-space-size=4096
  RCT_NEW_ARCH_ENABLED: '1'

jobs:
  check:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

  android:
    name: Android debug build & unit tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # API 37 ships as platforms;android-37.0 (not android-37). AGP still looks for
      # platforms/android-37 when compileSdk=37, so symlink after install.
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006

      - name: Symlink Android SDK platform 37.0 → 37
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          ls -la "$ANDROID_HOME/platforms/"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: cp android/app/google-services.ci.json android/app/google-services.json

      - name: Gradle assembleDebug + unit tests
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
