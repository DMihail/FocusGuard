name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'
  NODE_VERSION: '22'

jobs:
  checks:
    name: Lint, format, types & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci --watchman=false

      - name: E2E testIds sync
        run: npm run e2e:sync-testids

  android:
    name: Android debug build
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/dev' ||
        startsWith(github.ref, 'refs/heads/release/')
      )) || (github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        github.base_ref == 'dev' ||
        startsWith(github.base_ref, 'refs/heads/release/')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Prepare Firebase config for CI
        run: cp android/app/google-services.ci.json android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: >
          ./gradlew assembleDebug --no-daemon --no-configuration-cache -PreactNativeArchitectures=x86_64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Android release bundle (R8)
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (
        startsWith(github.ref, 'refs/heads/release/')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      - name: Prepare Firebase config for CI
        run: cp android/app/google-services.ci.json android/app/google-services.json

      - name: Build release bundle (R8 validation)
        working-directory: android
        run: >
          ./gradlew bundleRelease --no-daemon --no-configuration-cache -PreactNativeArchitectures=x86_64
